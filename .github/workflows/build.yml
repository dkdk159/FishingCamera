name: Build iOS App

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: |
        XCODE_PATH=$(ls -d /Applications/Xcode*.app | head -1)
        echo "Using $XCODE_PATH"
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        xcodebuild -version
      
    - name: Build simulator
      run: |
        xcodebuild \
          -project FishingCamera.xcodeproj \
          -target FishingCamera \
          -configuration Debug \
          -sdk iphonesimulator \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
          
    - name: Build device
      run: |
        xcodebuild \
          -project FishingCamera.xcodeproj \
          -target FishingCamera \
          -configuration Debug \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
          
    - name: Find and upload simulator build
      run: |
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "FishingCamera.app" -path "*Debug-iphonesimulator*" | head -1)
        echo "Simulator app: $APP_PATH"
        if [ -n "$APP_PATH" ]; then
          mkdir -p output/simulator
          cp -R "$APP_PATH" output/simulator/
        fi
        
    - name: Find and upload device build
      run: |
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "FishingCamera.app" -path "*Debug-iphoneos*" | head -1)
        echo "Device app: $APP_PATH"
        if [ -n "$APP_PATH" ]; then
          mkdir -p output/device
          cp -R "$APP_PATH" output/device/
        fi
        
    - name: Upload simulator build
      uses: actions/upload-artifact@v4
      with:
        name: FishingCamera-Simulator
        path: output/simulator/FishingCamera.app
        
    - name: Upload device build (unsigned)
      uses: actions/upload-artifact@v4
      with:
        name: FishingCamera-Device-Unsigned
        path: output/device/FishingCamera.app
