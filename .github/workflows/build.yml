name: Build iOS App

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: |
        XCODE_PATH=$(ls -d /Applications/Xcode*.app | head -1)
        echo "Using $XCODE_PATH"
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        xcodebuild -version
      
    - name: Build for device (no signing)
      run: |
        xcodebuild \
          -project FishingCamera.xcodeproj \
          -target FishingCamera \
          -configuration Debug \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build
          
    - name: Find and upload device build
      run: |
        APP_PATH=$(find . -name "FishingCamera.app" -path "*Debug-iphoneos*" | head -1)
        echo "Device app: $APP_PATH"
        if [ -n "$APP_PATH" ]; then
          mkdir -p output
          cp -R "$APP_PATH" output/
          # 打包成 IPA 结构
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -r FishingCamera.ipa Payload
          cd ..
        fi
        
    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: FishingCamera-App
        path: output/FishingCamera.app
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: FishingCamera-IPA
        path: output/FishingCamera.ipa
